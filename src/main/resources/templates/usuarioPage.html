<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Gerenciamento de Usuários</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        <!-- App Header -->
        <header class="app-header">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <h1 class="app-title">Gerenciamento de Usuários</h1>
            <p class="app-subtitle">Cadastre e visualize usuários cadastrados no sistema</p>
        </header>

        <!-- Dashboard Grid Layout -->
        <div class="dashboard-grid">
            
            <!-- Card 1: Cadastro de Usuário -->
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        Novo Cadastro
                    </h2>
                </div>

                <form id="usuarioForm" th:action="@{/usuarios}" th:object="${usuarioModel}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="nomeUsuario">Nome Completo</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" 
                                   id="nomeUsuario" 
                                   class="form-input" 
                                   th:field="*{nomeUsuario}" 
                                   placeholder="Digite o nome completo..." 
                                   required 
                                   autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cpf">CPF</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                    <line x1="7" y1="8" x2="17" y2="8"></line>
                                    <line x1="7" y1="12" x2="13" y2="12"></line>
                                    <line x1="7" y1="16" x2="10" y2="16"></line>
                                </svg>
                            </span>
                            <input type="text" 
                                   id="cpf" 
                                   class="form-input" 
                                   th:field="*{cpf}" 
                                   placeholder="000.000.000-00" 
                                   maxlength="14"
                                   required 
                                   autocomplete="off">
                        </div>
                    </div>

                    <button id="salvarUsuario" type="submit" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Cadastrar Usuário
                    </button>
                </form>

                <div class="nav-actions">
                    <a th:href="@{/usuarios/pesquisa}" class="nav-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"></polyline>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                        </svg>
                        Atualizar lista
                    </a>
                </div>
            </section>

            <!-- Card 2: Lista de Usuários -->
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Usuários Cadastrados
                    </h2>
                    <span class="badge" th:if="${usuarios != null}" th:text="${#lists.size(usuarios)} + ' cadastrados'">0 cadastrados</span>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nome do Usuário</th>
                                <th>CPF</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td>
                                    <span class="id-badge" th:text="'#' + ${usuario.id}">#1</span>
                                </td>
                                <td>
                                    <div class="user-cell">
                                        <div class="user-avatar" th:text="${#strings.substring(usuario.nomeUsuario, 0, 1)}">U</div>
                                        <span th:text="${usuario.nomeUsuario}">Nome de Exemplo</span>
                                    </div>
                                </td>
                                <td>
                                    <span style="font-family: monospace; color: var(--text-secondary);" th:text="${usuario.cpf}">000.000.000-00</span>
                                </td>
                            </tr>
                            <tr th:if="${usuarios == null or #lists.isEmpty(usuarios)}">
                                <td colspan="3">
                                    <div class="empty-state">
                                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="12"></line>
                                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                        </svg>
                                        <p>Nenhum usuário cadastrado até o momento.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Formatação automática do CPF (máscara)
        const cpfInput = document.getElementById("cpf");
        if (cpfInput) {
            cpfInput.addEventListener("input", function(e) {
                let value = e.target.value.replace(/\D/g, "");
                if (value.length > 11) value = value.slice(0, 11);
                
                if (value.length > 9) {
                    value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
                } else if (value.length > 6) {
                    value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
                } else if (value.length > 3) {
                    value = value.replace(/(\d{3})(\d{1,3})/, "$1.$2");
                }
                e.target.value = value;
            });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const iconSvg = type === 'success' 
                ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;

            toast.innerHTML = `
                <span class="toast-icon">${iconSvg}</span>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.getElementById("usuarioForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const form = event.target;
            const submitBtn = document.getElementById("salvarUsuario");
            const originalBtnHtml = submitBtn.innerHTML;
            const formData = new FormData(form);

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Salvando...';

            fetch(form.action, {
                method: form.method,
                body: formData
            }).then(response => {
                if (response.ok) {
                    showToast("Usuário salvo com sucesso!", "success");
                    setTimeout(() => {
                        window.location.href = "/usuarios/pesquisa";
                    }, 800);
                } else {
                    showToast("Erro ao salvar o usuário.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHtml;
                }
            }).catch(error => {
                console.error("Erro ao salvar o usuário:", error);
                showToast("Erro de conexão ao salvar.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            });
        });
    </script>
</body>
</html>
